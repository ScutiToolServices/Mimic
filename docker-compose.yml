name: mimic
services:
  mimic:
    build: .
    restart: unless-stopped
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      MIMIC_ADMIN_PASSWORD: ${MIMIC_ADMIN_PASSWORD:-}
      MIMIC_KITTEN2_URL: ${MIMIC_KITTEN2_URL:?set reachable TTSKitten2Model URL}
      MIMIC_KITTEN2_TOKEN: ${MIMIC_KITTEN2_TOKEN:?set model speech token}
      MIMIC_KITTEN2_ADMIN_PASSWORD: ${MIMIC_KITTEN2_ADMIN_PASSWORD:?set model admin password}
      MIMIC_TIMEOUT_SECONDS: ${MIMIC_TIMEOUT_SECONDS:-7200}
      MIMIC_MAX_CHARS: ${MIMIC_MAX_CHARS:-5000}
      MIMIC_TTL_HOURS: ${MIMIC_TTL_HOURS:-24}
      MIMIC_QUOTA_MB: ${MIMIC_QUOTA_MB:-200}
    ports:
      - "${MIMIC_BIND:-127.0.0.1}:${MIMIC_PORT:-8094}:8094"
    volumes:
      - mimic_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/health')"]
      interval: 15s
      timeout: 5s
      start_period: 15s
    networks: [citadel]
volumes:
  mimic_data:
networks:
  citadel:
    name: citadel_core
    external: true
