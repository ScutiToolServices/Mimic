# Mimic voice-cloning MCP server.
# Start:  docker compose up -d --build        (armory reaches it at http://mimic:29404/mcp)
# Needs a .env next to this file with SERVICE_ADMIN_PASSWORD; create the callers' tokens on /admin/. See .env.example.
# Speech runs in TTS_Kitten2_Model and/or TTS_Audio8_Model; save their addresses and tokens as connections on the admin page.

name: mimic

services:
  mimic:
    build: .
    restart: unless-stopped
    environment:
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:?set SERVICE_ADMIN_PASSWORD in .env (it unlocks the token page)}
      SERVICE_KITTEN2_ADMIN_PASSWORD: ${SERVICE_KITTEN2_ADMIN_PASSWORD:?set model admin password}
      SERVICE_AUDIO8_ADMIN_PASSWORD: ${SERVICE_AUDIO8_ADMIN_PASSWORD:-}
      SERVICE_TIMEOUT_SECONDS: ${SERVICE_TIMEOUT_SECONDS:-7200}
      SERVICE_MAX_CHARS: ${SERVICE_MAX_CHARS:-5000}
      SERVICE_TTL_HOURS: ${SERVICE_TTL_HOURS:-24}
      SERVICE_QUOTA_MB: ${SERVICE_QUOTA_MB:-200}
    ports:
      - "${SERVICE_BIND:-127.0.0.1}:${SERVICE_PORT:-29404}:29404"
    volumes:
      - mimic_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29404/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
    networks: [citadel]

volumes:
  mimic_data:

networks:
  # Join the Citadel stack's network so armory/ember_api can reach http://mimic:29404. Start the Citadel stack first:
  # it creates this network.
  citadel:
    name: citadel_core
    external: true
