# Mimic voice-cloning MCP server.
# Start:  docker compose up -d --build        (armory reaches it at http://mimic:29404/mcp)
# Needs a .env next to this file with INTERNAL_API_TOKEN (same value as Citadel's); see .env.example.
# Speech runs in TTS_Kitten2_Model and/or TTS_Audio8_Model; save their addresses and tokens as connections on the admin page.

name: mimic

services:
  mimic:
    build: .
    restart: unless-stopped
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      MIMIC_ADMIN_PASSWORD: ${MIMIC_ADMIN_PASSWORD:-}
      MIMIC_KITTEN2_ADMIN_PASSWORD: ${MIMIC_KITTEN2_ADMIN_PASSWORD:?set model admin password}
      MIMIC_AUDIO8_ADMIN_PASSWORD: ${MIMIC_AUDIO8_ADMIN_PASSWORD:-}
      MIMIC_TIMEOUT_SECONDS: ${MIMIC_TIMEOUT_SECONDS:-7200}
      MIMIC_MAX_CHARS: ${MIMIC_MAX_CHARS:-5000}
      MIMIC_TTL_HOURS: ${MIMIC_TTL_HOURS:-24}
      MIMIC_QUOTA_MB: ${MIMIC_QUOTA_MB:-200}
    ports:
      - "${MIMIC_BIND:-127.0.0.1}:${MIMIC_PORT:-29404}:29404"
    volumes:
      - mimic_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29404/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
    networks: [citadel]

volumes:
  mimic_data:

networks:
  # Join the Citadel stack's network so armory/ember_api can reach http://mimic:29404. Start the Citadel stack first:
  # it creates this network.
  citadel:
    name: citadel_core
    external: true
